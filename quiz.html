<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวัดระดับ (Crochet Quiz) - CrochetStudio</title>
    <link rel="stylesheet" href="css/style.css?v=3.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; background: var(--bg-secondary); padding: 3rem; border-radius: 20px; box-shadow: var(--shadow-md); }
        .question { font-size: 1.3rem; margin-bottom: 1.5rem; color: var(--text-primary); font-weight: 600; }
        .options { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
        .option-btn { background: var(--bg-primary); border: 2px solid var(--border); padding: 1rem 1.5rem; border-radius: 12px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s; color: var(--text-primary); font-family: var(--font-body); }
        .option-btn:hover { background: var(--border); }
        .option-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }
        .option-btn.correct { background: #4caf50; color: white; border-color: #4caf50; }
        .option-btn.wrong { background: #f44336; color: white; border-color: #f44336; }
        #quiz-result { display: none; text-align: center; padding: 2rem; background: var(--bg-primary); border-radius: 15px; margin-top: 2rem; }
    </style>
</head>
<body>
    <header id="header">
        <div class="logo"><a href="index.html"><h1>Crochet<span>Studio</span></h1></a></div>
        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="index.html#guide-section">คลังความรู้</a></li>
                <li><a href="patterns.html">แพทเทิร์น</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" style="min-height: 30vh; padding-top: 8rem; padding-bottom: 2rem;">
        <div class="hero-content reveal">
            <span class="hero-tag">Test Your Knowledge</span>
            <h2 style="font-size: 3rem;">แบบทดสอบวัดระดับ</h2>
            <p>มาทดสอบความรู้หลังจากอ่านบทความจบแล้วกันเถอะ!</p>
        </div>
    </section>

    <section class="section" style="padding-top: 0;">
        <div class="quiz-container reveal" id="quiz-app">
            <div id="quiz-content">
                <div class="question" id="q-text">1. คำสั่ง 'sc' หรือ 'X' หมายถึงอะไร?</div>
                <div class="options" id="options-container">
                    <!-- Options will be injected here via JS -->
                </div>
                <button class="btn btn-primary" id="next-btn" style="width: 100%; display: none;">ข้อถัดไป <i class="fas fa-arrow-right"></i></button>
            </div>
            
            <div id="quiz-result">
                <i class="fas fa-trophy" style="font-size: 4rem; color: #ffd700; margin-bottom: 1rem;"></i>
                <h3 style="font-size: 2rem; margin-bottom: 1rem;">คุณได้คะแนน <span id="score-text">0/5</span></h3>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;" id="feedback-text">ยอดเยี่ยมมาก! คุณพร้อมสำหรับการเริ่มต้นถักโครเชต์แล้ว</p>
                <a href="index.html#guide-section" class="btn btn-secondary">กลับสู่คลังความรู้</a>
            </div>
        </div>
    </section>

    <script>
        const quizData = [
            { q: "คำสั่ง 'sc' หรือ 'X' หมายถึงการถักแบบใด?", options: ["ถักโซ่", "ควักธรรมดา", "พันหัวเข็ม 1 ครั้ง", "เลื่อนห่วง"], answer: 1 },
            { q: "ถ้าชิ้นงานที่คุณถักเริ่ม 'ย้วยและบานออก' คุณควรแก้ไขอย่างไร?", options: ["ลดขนาดเข็มถักลง", "เพิ่มขนาดเข็มถักขึ้น", "ดึงไหมพรมให้ตึงขึ้น", "ยัดใยเพิ่ม"], answer: 0 },
            { q: "แบบจับเข็มแบบใดที่เหมาะกับ 'คนปวดข้อมือง่าย' หรือถักไหมเส้นใหญ่?", options: ["Pencil Grip", "Knife Grip", "Scissor Grip", "Fork Grip"], answer: 1 },
            { q: "คำสั่ง [sc, inc] x 6 หมายความว่าอย่างไร?", options: ["ถัก X อย่างเดียว 6 ครั้ง", "ถัก V อย่างเดียว 6 ครั้ง", "ถัก X และ V สลับกันไป 6 ชุด", "ถัก X 6 ครั้ง แล้วถัก V 6 ครั้ง"], answer: 2 },
            { q: "เข็มทอง (Golden Hook) แบบสองหัว มักจะมีเบอร์อะไรอยู่คู่กัน?", options: ["1/0 กับ 2/0", "3/0 กับ 4/0", "5/0 กับ 7/0", "ถูกทุกข้อ"], answer: 3 }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const quizContent = document.getElementById('quiz-content');
        const quizResult = document.getElementById('quiz-result');

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = 'none';
            qText.innerText = `${currentQ + 1}. ${quizData[currentQ].q}`;
            optionsContainer.innerHTML = '';
            
            quizData[currentQ].options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(btn, index) {
            if (answered) return;
            answered = true;
            const correctIndex = quizData[currentQ].answer;
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            
            if (index === correctIndex) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
            }
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                quizContent.style.display = 'none';
                quizResult.style.display = 'block';
                document.getElementById('score-text').innerText = `${score}/${quizData.length}`;
                if(score === 5) document.getElementById('feedback-text').innerText = "Perfect! คุณคือปรมาจารย์โครเชต์ตัวจริง!";
                else if (score >= 3) document.getElementById('feedback-text').innerText = "เก่งมาก! คุณมีความรู้พื้นฐานที่แน่นพอตัวเลย";
                else document.getElementById('feedback-text').innerText = "ไม่เป็นไร! ลองกลับไปทบทวนบทความอีกรอบแล้วมาทดสอบใหม่นะ";
            }
        };

        loadQuestion();
    </script>
</body>
</html>
